
apiVersion: v1
kind: Service
metadata:
  name: {{ include "knowledge-explorer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "knowledge-explorer.labels" . | nindent 4 }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=namespace is set via .Release.Namespace, bound only at helm install/template time
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "knowledge-explorer.selectorLabels" . | nindent 4 }}
